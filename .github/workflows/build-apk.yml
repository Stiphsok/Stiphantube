
name: Build STIPHANTUBE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "Repository files:"
          ls -la
          if [ -f "./gradlew" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "./STIPHANTUBE_ANDROID/gradlew" ]; then
            echo "dir=STIPHANTUBE_ANDROID" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: gradlew not found."
            echo "The ZIP may need to be extracted and uploaded first."
            exit 1
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STIPHANTUBE-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
