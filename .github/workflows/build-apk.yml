
name: Build STIPHANTUBE APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          ls -la
          find . -maxdepth 3 -name gradlew -print
          cd STIPHANTUBE_ANDROID
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: STIPHANTUBE-APK
          path: STIPHANTUBE_ANDROID/app/build/outputs/apk/debug/*.apk
          
